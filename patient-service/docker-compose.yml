version: "3.9"

services:
  postgres-db:
    image: postgres
    container_name: patient-service-db
    environment:
      POSTGRES_DB: patient_service_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    ports:
      - "5001:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - patient-network

  patient-service:
    build: .
    container_name: patient-service
    ports:
      - "4000:4000"
    depends_on:
      - postgres-db
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/patient_service_db
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: admin123
      BILLING_SERVICE_ADDRESS: billing-service
      BILLING_SERVICE_GRPC_PORT: 9001
    networks:
      - patient-network

volumes:
  postgres-data:

networks:
  patient-network: